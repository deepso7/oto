[package]
name = "oto-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["dfn3"]
# DeepFilterNet3 as the default model. `--no-default-features` builds an RNNoise-only app.
dfn3 = ["oto-engine/dfn3"]

[dependencies]
oto-engine.workspace = true
rune.workspace = true
rune-kit.workspace = true
dirs = "6"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
# Rune's own tray has no macOS backend yet. tray-icon's NSStatusItem lives on Rune's main
# thread, created from an `AppHandle::update` once the event loop runs.
tray-icon = { version = "0.26", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSResponder", "NSView", "NSWindow", "NSScreen", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSArray", "NSString"] }
# The microphone-permission completion handler (permission.rs).
block2 = "0.6"

[target.'cfg(not(target_os = "macos"))'.dependencies]
# Start at login off macOS (login.rs); macOS writes its own LaunchAgent.
auto-launch = "0.6"
