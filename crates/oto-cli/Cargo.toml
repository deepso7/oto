[package]
name = "oto-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["dfn3", "onnx", "fastenhancer"]
# DeepFilterNet3 as the default model. `--no-default-features` builds an RNNoise-only CLI.
dfn3 = ["oto-engine/dfn3"]
# DPDFNet-2 through ONNX Runtime, as the Max tier.
onnx = ["oto-engine/onnx"]
# FastEnhancer-S as the Fast tier. Evaluation only; release builds leave it out.
fastenhancer = ["onnx", "oto-engine/fastenhancer"]

[dependencies]
lexopt = "0.3"
oto-engine.workspace = true

[[bin]]
name = "oto"
path = "src/main.rs"
