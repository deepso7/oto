[project]
name = "oto-eval"
version = "0.1.0"
description = "Evaluation harness for Oto's noise-suppression models (docs/plans/0002-e2e-roadmap.md)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
# The CI suite is stdlib only: `python3 tools/eval/eval.py --suite ci` needs nothing installed.
dependencies = []

[project.optional-dependencies]
# Faster metrics on long files, and polyphase resampling for PESQ.
metrics = ["numpy>=1.26", "scipy>=1.11"]
# PESQ (wideband) and DNSMOS P.835 (bring your own sig_bak_ovr.onnx).
perceptual = ["numpy>=1.26", "scipy>=1.11", "pesq>=0.0.4", "onnxruntime>=1.17"]
# Same-ASR head-to-head: WER, first-word deletion, leaked and hallucinated words.
asr = ["faster-whisper>=1.0"]
# NVIDIA Parakeet TDT 0.6B v2 through onnx-asr (numpy + onnxruntime, no torch/NeMo; wheels for
# macOS arm64 and Linux x86_64/aarch64): the Krisp Voice Isolation Benchmark's recogniser.
# Weights (CC-BY-4.0) download from Hugging Face on first use: ~2.4 GB fp32, ~0.65 GB int8.
parakeet = ["onnx-asr[cpu,hub]>=0.12", "numpy>=1.26"]
# NeMo text normalisation, Krisp's exact stage 2 (krisp.py falls back to a stdlib verbaliser).
# pynini wheels are Linux-first; on macOS use conda-forge pynini if pip fails.
nemo-tn = ["nemo-text-processing>=1.1"]

[tool.uv]
package = false
