<!-- Oto app icon, simplified for 16 and 32 px: fewer, heavier strokes. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4392F7"/>
      <stop offset="1" stop-color="#285CC2"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect x="100" y="112" width="824" height="824" rx="185" fill="#000" fill-opacity=".3" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#fill)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="4"/>
  <g stroke="#FFFFFF" stroke-width="58" stroke-linecap="round" fill="none">
    <path d="M250 452V572M344 362V662" stroke="#A8C8F8"/>
    <circle cx="512" cy="512" r="74" stroke-width="64"/>
    <path d="M680 382V642M774 452V572"/>
  </g>
</svg>
