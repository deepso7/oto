# Builds, verifies and publishes a macOS release for a tag release-plz just made.
#
# release-plz (release-plz.yml, on push to main) tags vX.Y.Z, creates a DRAFT release, and calls
# this workflow. Because it is called from a push to main, github.ref is refs/heads/main, not
# the tag. Manual recovery runs against main too:
#   gh workflow run macos-release.yml --ref main -f tag=vX.Y.Z
#
#   validate-tag   (no secrets) the tag is vX.Y.Z, on main's history, and matches Cargo.toml
#   check-release  (no secrets) is the release still a draft?
#   dmg            (release environment, drafts only) build, sign, notarize and round-trip
#                  check the DMG, the update zip and the unsigned manifest, from exactly the
#                  verified commit
#   publish        (release environment, one at a time across all tags) re-check the tag and
#                  draft state, sign update.json, upload and verify every asset, publish
#                  (latest only if newest), update the Homebrew tap. For an already-published
#                  release it uploads nothing, re-verifies, and reconciles the tap.
#
# Pull requests are checked by macos-pr-check.yml (no secrets). Setup and recovery:
# packaging/macos/README.md, "Releasing from CI".
name: macOS release

on:
  workflow_call:
    inputs:
      tag: { type: string, required: true }   # e.g. v0.1.0; the (draft) GitHub release exists
  workflow_dispatch:
    inputs:
      tag: { type: string, required: true }   # re-run / recover a release; dispatch on main

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  validate-tag:
    name: Validate ${{ inputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the ref and the tag's form
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::run this on main (gh workflow run macos-release.yml --ref main -f tag=$TAG), not $GITHUB_REF"
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' is not of the form vX.Y.Z"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the tag and check it is on main
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --force "$remote" \
            "+refs/heads/main:refs/remotes/origin/main" "+refs/tags/$TAG:refs/tags/$TAG"
          TAG_SHA="$(git rev-parse "refs/tags/$TAG^{commit}")"
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if ! git merge-base --is-ancestor "$TAG_SHA" "$MAIN_SHA"; then
            echo "::error::$TAG ($TAG_SHA) is not on main ($MAIN_SHA)"
            exit 1
          fi
          version="$(git show "$TAG_SHA:Cargo.toml" | awk '/^\[workspace\.package\]/ { p = 1; next } /^\[/ { p = 0 }
              p && $1 == "version" { gsub(/"/, "", $3); print $3; exit }')"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::$TAG does not match the workspace version in Cargo.toml at $TAG_SHA (${version:-none found})"
            exit 1
          fi
          # The build scripts come from the tag, so tags older than this pipeline can't be built.
          if ! git cat-file -e "$TAG_SHA:crates/oto-sign/Cargo.toml" 2>/dev/null; then
            echo "::error::$TAG predates crates/oto-sign and the draft-release pipeline"
            exit 1
          fi
          echo "sha=$TAG_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$TAG → $TAG_SHA (on main at $MAIN_SHA), version $version"

  check-release:
    name: Check the release of ${{ inputs.tag }}
    needs: validate-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write # GITHUB_TOKEN only sees draft releases with write access
    outputs:
      is_draft: ${{ steps.state.outputs.is_draft }}
    steps:
      - name: Read the draft state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"; then
            echo "::error::there is no GitHub release for $TAG; create it with: gh release create $TAG --draft --verify-tag, then re-run on main"
            exit 1
          fi
          echo "is_draft=$is_draft" >> "$GITHUB_OUTPUT"
          echo "$TAG draft: $is_draft"

  dmg:
    name: Build ${{ inputs.tag }}
    needs: [validate-tag, check-release]
    if: ${{ needs.check-release.outputs.is_draft == 'true' }}
    runs-on: macos-26
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read
    concurrency:
      group: macos-release-build-${{ inputs.tag }}
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.validate-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-tag.outputs.sha }}
          persist-credentials: false

      - name: Check the checkout
        env:
          SHA: ${{ needs.validate-tag.outputs.sha }}
        run: |
          [ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "::error::checked out $(git rev-parse HEAD), expected $SHA"; exit 1; }
          echo "Building Oto $VERSION from $SHA"

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install   # the one pinned in rust-toolchain.toml
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc --version
          xcodebuild -version

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-release

      - name: Set up signing and notarization
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # Public identity name, not a secret; override with the MACOS_SIGN_ID variable.
          SIGN_ID: "${{ vars.MACOS_SIGN_ID || 'Developer ID Application: Deepanshu Singh (T9DPKXJBUS)' }}"
        run: scripts/macos/ci-keychain.sh setup

      # SIGN_ID, NOTARY_PROFILE and NOTARY_KEYCHAIN come from the previous step. Writes the DMG,
      # the update zip, their .sha256 files and update-payload.json to target/dist.
      - name: Build, sign, notarize and round-trip check
        run: scripts/macos/release.sh

      - name: Upload the release files as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: oto-release-${{ inputs.tag }}
          path: |
            target/dist/Oto-${{ env.VERSION }}.dmg
            target/dist/Oto-${{ env.VERSION }}.dmg.sha256
            target/dist/Oto-${{ env.VERSION }}-macos.zip
            target/dist/Oto-${{ env.VERSION }}-macos.zip.sha256
            target/dist/update-payload.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Remove signing credentials
        if: ${{ always() }}
        run: |
          # Absent if the job failed before checkout, in which case there's nothing to clean.
          if [ -f scripts/macos/ci-keychain.sh ]; then scripts/macos/ci-keychain.sh cleanup; fi

  publish:
    name: Publish ${{ inputs.tag }}
    needs: [validate-tag, check-release, dmg]
    # Runs after a successful build (draft) and also when the build was skipped because the
    # release is already published, to re-verify it and reconcile the Homebrew tap.
    if: ${{ always() && needs.validate-tag.result == 'success' && needs.check-release.result == 'success' && (needs.dmg.result == 'success' || needs.dmg.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # upload assets, publish the release
    # One publish at a time across all tags, never cancelled, so "latest" only moves forward.
    concurrency:
      group: oto-release-publish
      cancel-in-progress: false
    env:
      TAG: ${{ inputs.tag }}
      SHA: ${{ needs.validate-tag.outputs.sha }}
      DMG_RESULT: ${{ needs.dmg.result }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-tag.outputs.sha }}
          persist-credentials: false

      - name: Build oto-sign
        run: |
          rustup toolchain install   # the one pinned in rust-toolchain.toml
          cargo build --release --locked -p oto-sign
          echo "OTO_SIGN=$PWD/target/release/oto-sign" >> "$GITHUB_ENV"

      # Only after a build; an already-published release is checked from GitHub itself.
      - name: Download the build
        if: ${{ needs.dmg.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: oto-release-${{ inputs.tag }}
          path: ${{ runner.temp }}/artifacts

      - name: Sign, upload, verify, publish and update the tap
        env:
          OTO_UPDATE_SIGNING_KEY: ${{ secrets.OTO_UPDATE_SIGNING_KEY }}
          OTO_UPDATE_VERIFY_PUBKEYS: ${{ vars.OTO_UPDATE_VERIFY_PUBKEYS }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP: ${{ vars.HOMEBREW_TAP || 'deepso7/homebrew-oto' }}
          ARTIFACTS: ${{ runner.temp }}/artifacts
        run: scripts/macos/publish-release.sh
