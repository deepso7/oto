[package]
name = "oto-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Oto-1 for browser AudioWorklets: a wasm-bindgen-free cdylib with an extern \"C\" ABI and zero imports"

[lib]
# cdylib for wasm32-unknown-unknown; rlib so the ABI can be tested natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
oto-dsp = { workspace = true, features = ["oto1"] }
