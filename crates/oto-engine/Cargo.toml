[package]
name = "oto-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["dfn3"]
# Run DeepFilterNet3 for the Standard and Max tiers (see `model_for`). Without it every tier
# is RNNoise and the build has no tract.
dfn3 = ["oto-dsp/dfn3"]

[dependencies]
oto-dsp.workspace = true
rtrb = "0.4"
rubato = "5"
