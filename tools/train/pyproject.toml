[project]
name = "oto-train"
version = "0.1.0"
description = "PyTorch training, data packing and .otow export for Oto-1 (docs/plans/0004-oto-v1-model-and-wasm.md)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "scipy>=1.11",
    "safetensors>=0.4",
    "soundfile>=0.12",
]

[project.optional-dependencies]
# 48 kHz paired near/far RIR bank generation (MIT).
rir = ["pyroomacoustics>=0.7.4"]
# Shard / checkpoint upload to Cloudflare R2 (S3 API) or a private Hugging Face dataset repo.
upload = ["boto3>=1.34", "huggingface_hub>=0.24"]
# Spot-check spectrogram PNGs.
plots = ["matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
oto-train = "oto_train.train:cli"
oto-export = "oto_train.export_otow:main"
oto-pack = "oto_train.data.pack_shards:main"
oto-rir = "oto_train.data.rir_gen:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oto_train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
